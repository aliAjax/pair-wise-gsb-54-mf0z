<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>跨海光缆故障与抢修协调</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #17212b; }
    main { max-width: 1100px; margin: auto; }
    button { padding: .5rem .85rem; cursor: pointer; margin: .2rem .2rem .2rem 0; }
    pre { background: #f4f6f8; padding: 1rem; overflow: auto; border-radius: 8px; }
    .row { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
    h2 { margin-top: 1.6rem; }
    table { border-collapse: collapse; width: 100%; font-size: .85rem; }
    th, td { border: 1px solid #d7dde3; padding: .35rem .5rem; text-align: left; vertical-align: top; }
    th { background: #eef2f5; }
    .tag { display: inline-block; padding: .1rem .45rem; border-radius: 10px; font-size: .75rem; margin-right: .25rem; }
    .held { background: #e3f0ff; color: #1457b8; }
    .consumed { background: #e6f7ec; color: #17703d; }
    .gap { background: #fff1e0; color: #a05313; }
    .review { background: #fdeaea; color: #a52828; }
    .muted { color: #6a7785; }
  </style>
</head>
<body>
<main>
  <h1>跨海光缆故障与抢修协调 · 动员调度台</h1>
  <div class="row">
    <button id="console">刷新调度台</button>
    <button id="resources">资源目录</button>
    <button id="records">故障单</button>
    <button id="stats">状态统计</button>
  </div>
  <div id="view"></div>
  <pre id="output" class="muted">点击按钮读取数据。确认动员、回执提交等写操作通过 README 中的 JSON 接口调用。</pre>
</main>
<script>
const headers = {"X-User-Id":"demo-dispatcher","X-Role":"dispatcher","X-Org":"demo"};
function esc(v) { return String(v ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
async function getJson(path) {
  const response = await fetch(path, {headers});
  return {status: response.status, data: await response.json()};
}
async function showRaw(path) {
  const {data} = await getJson(path);
  document.getElementById("view").innerHTML = "";
  document.getElementById("output").textContent = JSON.stringify(data, null, 2);
}
function holdsTable(holds) {
  if (!holds.length) return "<p class='muted'>无活跃占用。</p>";
  return "<table><tr><th>动员编号</th><th>故障单</th><th>资源</th><th>类型</th><th>数量/容量</th><th>时间窗</th><th>状态</th></tr>" +
    holds.map(h => `<tr><td>${esc(h.mob_no)}</td><td>#${esc(h.record_id)}</td><td>${esc(h.resource_name)} ${esc(h.batch_no)}</td>
      <td>${esc(h.rkind)}</td><td>${esc(h.quantity)}</td><td>${esc(h.window_start)}<br>${esc(h.window_end)}</td>
      <td><span class="tag ${esc(h.state)}">${esc(h.state)}</span></td></tr>`).join("") + "</table>";
}
function gapsTable(gaps) {
  if (!gaps.length) return "<p class='muted'>无缺口草稿。</p>";
  return "<table><tr><th>动员编号</th><th>故障单</th><th>动员单状态</th><th>来源</th><th>缺口明细</th></tr>" +
    gaps.map(g => `<tr><td>${esc(g.mob_no)}</td><td>#${esc(g.record_id)}</td><td>${esc(g.state)}</td>
      <td><span class="tag gap">${esc(g.source)}</span></td>
      <td>${g.shortfalls.map(s => esc(s.message)).join("<br>")}</td></tr>`).join("") + "</table>";
}
function reviewTable(pending) {
  if (!pending.length) return "<p class='muted'>无待复核回执。</p>";
  return "<table><tr><th>动员编号</th><th>故障单</th><th>来源单位</th><th>回传时间</th><th>不符明细</th></tr>" +
    pending.map(p => `<tr><td>${esc(p.mob_no)}</td><td>#${esc(p.record_id)}</td><td>${esc(p.supplier)}</td>
      <td>${esc(p.receipt_at)}<br><span class="tag review">${esc(p.source)}</span></td>
      <td>${p.mismatches.map(m => esc(m.message)).join("<br>")}</td></tr>`).join("") + "</table>";
}
function eventsList(events) {
  return "<table><tr><th>时间</th><th>动员编号</th><th>事件</th><th>来源</th><th>操作人</th><th>明细</th></tr>" +
    events.map(e => `<tr><td>${esc(e.created_at)}</td><td>${esc(e.mob_no)}</td><td>${esc(e.kind)}</td>
      <td><span class="tag ${e.source==='survey'?'gap':(e.source==='external_org'||e.source==='receipt'?'review':'held')}">${esc(e.source)}</span></td>
      <td>${esc(e.actor_id)}</td><td><pre>${esc(JSON.stringify(e.details, null, 2))}</pre></td></tr>`).join("") + "</table>";
}
async function showConsole() {
  const {data} = await getJson("/api/console");
  document.getElementById("output").textContent = JSON.stringify(data, null, 2);
  document.getElementById("view").innerHTML =
    "<h2>资源占用（船机 / 班组 / 备缆）</h2>" + holdsTable(data.active_holds) +
    "<h2>容量缺口（草稿，等待资源释放后续作）</h2>" + gapsTable(data.shortfalls) +
    "<h2>待复核到货回执（复核前不装船）</h2>" + reviewTable(data.pending_review) +
    "<h2>动员事件时间线（审计）</h2>" + eventsList(data.events);
}
document.getElementById("console").onclick = showConsole;
document.getElementById("resources").onclick = () => showRaw("/api/resources");
document.getElementById("records").onclick = () => showRaw("/api/records?limit=20");
document.getElementById("stats").onclick = () => showRaw("/api/stats");
showConsole();
</script>
</body>
</html>
