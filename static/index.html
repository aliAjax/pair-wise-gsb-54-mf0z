<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>跨海光缆故障与抢修协调</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #17212b; }
    main { max-width: 1080px; margin: auto; }
    button { padding: .55rem .9rem; cursor: pointer; }
    pre { background: #f4f6f8; padding: 1rem; overflow: auto; border-radius: 8px; }
    .row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
  </style>
</head>
<body>
<main>
  <h1>跨海光缆故障与抢修协调</h1>
  <p>最小演示页。完整动员流程通过README中的JSON接口调用；调度台可查看占用、缺口与待复核来源。</p>
  <div class="row">
    <button id="board">调度台 /api/board</button>
    <button id="resources">资源库存</button>
    <button id="load">故障单列表</button>
    <button id="stats">状态统计</button>
  </div>
  <pre id="output">点击上方按钮读取服务状态。</pre>
</main>
<script>
const headers = {"X-User-Id":"demo-admin","X-Role":"admin","X-Org":"demo"};
async function show(path) {
  const response = await fetch(path, {headers});
  const data = await response.json();
  document.getElementById("output").textContent = JSON.stringify(data, null, 2);
}
document.getElementById("board").onclick = () => show("/api/board");
document.getElementById("resources").onclick = () => show("/api/resources");
document.getElementById("load").onclick = () => show("/api/records?limit=20");
document.getElementById("stats").onclick = () => show("/api/stats");
</script>
</body>
</html>
